<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop | CATE STUDIO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/shop.css" />
  </head>

  <body class="shop-page">
    <header id="header">
      <div class="container nav">
        <a href="../../index.html" class="logo"> CATE STUDIO </a>

        <nav>
          <ul class="nav-links">
            <li><a href="../../index.html">Home</a></li>
            <li><a href="shop.html" class="active">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>

        <div class="nav-icons">
          <button type="button" aria-label="Search" id="search-toggle">
            <i class="ri-search-line"></i>
          </button>

          <button type="button" aria-label="Account">
            <i class="ri-user-line"></i>
          </button>

          <button type="button" aria-label="Shopping bag">
            <i class="ri-shopping-bag-line"></i>
          </button>
        </div>

        <button type="button" id="menu" aria-label="Open menu">
          <i class="ri-menu-line"></i>
        </button>
      </div>
    </header>

    <!-- KONTEN -->
    <main>
      <section class="shop-hero">
        <div class="container">
          <span class="subtitle">SHOP</span>
          <h1>All Products</h1>
          <p class="breadcrumb">
            <a href="../../index.html">Home</a> / <span>Shop</span>
          </p>
        </div>
      </section>

      <section class="shop">
        <div class="container shop-layout">
          <button class="filter-trigger" id="filterTrigger" type="button">
            <i class="ri-equalizer-line"></i> Filters
          </button>

          <aside class="shop-sidebar" id="shopSidebar">
            <div class="sidebar-head">
              <h3>Filters</h3>
              <i class="ri-close-line" id="closeSidebar"></i>
            </div>

            <div class="search-box">
              <i class="ri-search-line"></i>
              <input type="text" id="productSearch" placeholder="Search" />
            </div>

            <div class="filter-group">
              <button class="filter-title" type="button">
                Categories <i class="ri-arrow-up-s-line"></i>
              </button>
              <div class="filter-body">
                <label class="filter-option">
                  <input type="checkbox" name="category" value="tops" />
                  <span>Tops</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="category" value="bottoms" />
                  <span>Bottoms</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="category" value="accessories" />
                  <span>Accessories</span>
                </label>
              </div>
            </div>

            <div class="filter-group">
              <button class="filter-title" type="button">
                Price <i class="ri-arrow-up-s-line"></i>
              </button>
              <div class="filter-body">
                <label class="filter-option">
                  <input type="radio" name="price" value="0-650000" />
                  <span>Under Rp 650,000</span>
                </label>
                <label class="filter-option">
                  <input type="radio" name="price" value="650000-1000000" />
                  <span>Rp 650,000 - Rp 1,000,000</span>
                </label>
                <label class="filter-option">
                  <input type="radio" name="price" value="1000000-1300000" />
                  <span>Rp 1,000,000 - Rp 1,300,000</span>
                </label>
              </div>
            </div>

            <button
              class="btn-light clear-filters"
              id="clearFilters"
              type="button"
            >
              Clear Filters
            </button>
          </aside>

          <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

          <div class="shop-content">
            <div class="shop-toolbar">
              <p class="result-count">
                <span id="resultCount">6</span> products
              </p>
              <div class="sort-box">
                <label for="sortSelect">Sort :</label>
                <select id="sortSelect">
                  <option value="featured">Featured</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="name-asc">Name: A-Z</option>
                </select>
              </div>
            </div>

            <div class="product-grid" id="productGrid"></div>

            <p class="no-results" id="noResults" hidden>
              No products match your filters.
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer-grid">
        <div>
          <h3>CATE STUDIO</h3>
          <p>Wear confidence. Own the streets.</p>
        </div>

        <div>
          <h4>Shop</h4>
          <a href="shop.html">Men</a>
          <a href="shop.html">Women</a>
          <a href="shop.html">Accessories</a>
        </div>

        <div>
          <h4>Support</h4>
          <a href="#">FAQ</a>
          <a href="assets/pages/shipping.html">Shipping</a>
          <a href="assets/pages/contact.html">Contact</a>
        </div>

        <div>
          <h4>Follow</h4>
          <a href="#">Instagram</a>
          <a href="#">TikTok</a>
          <a href="#">Facebook</a>
        </div>
      </div>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/shop.js"></script>
  </body>
</html>
